<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
</head>
<body>
    <h1>Testando o uso de iframe</h1>
    <!-- tamanho padrão dos iframes são de 300x150 (height, width)-->
    <p>
        Acessando o site do 
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" scolling="auto">

            <!-- no parâmetro de iframe nos "scolling" existem 3 opções
             o "auto" que é o padrão
             o "yes" mesmo que caiba no site todo aparece a barra de rolagem 
             e o "no" impede que a barra de rolagem funcione
             
             Obs: em alguns navegadores os paratros podem ou não funcinar, um erro comum que acontece por conta dos navegadores
             -->

            <a href="https://www.cursoemvideo.com/" target="_blank"></a>
        </iframe>

        para aprender a programar.

    </p>

    <p>
        Acesse o canal do ShiftPlays
        <iframe src="https://www.youtube.com/watch?v=N4WxD32w5zA" frameborder="0">
            <a href="https://www.youtube.com/@ShiftPlaysGames" target="_blank">ShiftPlays</a>
        </iframe>
        para aprender mais sobre mods insanos, pena que não funciona dentro do iframe...
    </p>

    <p>
        O repositório do Guanabara
        <iframe src="https://github.com/gustavoguanabara" frameborder="0">
            no <a href="https://github.com/gustavoguanabara">github</a>
        </iframe>

        também é bem legal!
    </p>

    <p>A aula onde aprendemos isso <iframe width="560" height="315" src="https://www.youtube.com/embed/eAxGt3ObQ24?si=7OWWtPlF5Z1n9PKJ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></p>
</body>
</html>
